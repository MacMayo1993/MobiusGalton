name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulations/python/requirements.txt

      - name: Verify analytic formula
        run: |
          python - <<'EOF'
          import numpy as np
          K_STAR = 1.0 / (2.0 * np.log(2.0))

          def alpha_plus(W, H):
              return 0.5 * (1.0 + np.cos(np.pi / W) ** H)

          def inverse_W(alpha, H):
              if not (0.5 < alpha < 1.0): return None
              inner = (2.0 * alpha - 1.0) ** (1.0 / H)
              if abs(inner) > 1.0: return None
              return float(np.pi / np.arccos(inner))

          # Round-trip test
          for W in [5, 10, 14, 20, 30]:
              for H in [10, 25, 50]:
                  a = alpha_plus(W, H)
                  W_rec = inverse_W(a, H)
                  assert W_rec is not None, f"inverse_W returned None for W={W}, H={H}"
                  assert abs(W_rec - W) < 1e-8, f"Round-trip error too large: {abs(W_rec - W)}"

          # k* test
          for H in [9, 16, 25, 36]:
              Wc = inverse_W(K_STAR, H)
              approx = 2.46 * H**0.5
              assert abs(Wc - approx) / approx < 0.02, f"Wc approx wrong for H={H}"

          print("All analytic formula tests PASSED")
          EOF

      - name: Run inverse solver (no plot)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'simulations/python')
          # Import and run the non-plotting parts
          from inverse_solver import round_trip_test, kstar_recovery_test
          round_trip_test(H=25)
          kstar_recovery_test()
          print("inverse_solver tests PASSED")
          EOF

      - name: Smoke test Monte Carlo (small N)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'simulations/python')
          import numpy as np
          from classical_mc import run_simulation, analytic_alpha
          # Small run for CI
          for W in [8, 14, 20]:
              a_sim, _, _ = run_simulation(W, H=20, N=5000, mode='mobius')
              a_th = analytic_alpha(W, 20)
              diff = abs(a_sim - a_th)
              print(f"W={W}: sim={a_sim:.4f}, theory={a_th:.4f}, |Δ|={diff:.4f}")
              assert diff < 0.05, f"MC too far from theory: {diff}"
          print("Monte Carlo smoke test PASSED")
          EOF

      - name: Smoke test single-photon walk
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'simulations/python')
          from single_photon import quantum_walk_single_photon, analytic_alpha
          a_qw, _, _ = quantum_walk_single_photon(14, 20, N=5000)
          a_th = analytic_alpha(14, 20)
          diff = abs(a_qw - a_th)
          print(f"QW: alpha={a_qw:.4f}, theory={a_th:.4f}, |Δ|={diff:.4f}")
          assert diff < 0.05, f"QW too far from theory: {diff}"
          print("Single-photon QW smoke test PASSED")
          EOF

      - name: Smoke test coherent optical
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'simulations/python')
          from optical_coherent import propagate_coherent
          alpha, _ = propagate_coherent(W=8, H=10)
          assert 0.5 < alpha < 1.0, f"Optical alpha out of range: {alpha}"
          print(f"Coherent optical: alpha={alpha:.4f}  PASSED")
          EOF

      - name: Smoke test collider
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'simulations/python')
          from collider_mini import run_collider
          result = run_collider(N=32, N_steps=64, topology='mobius')
          assert result['overlap'].max() > 0, "No collision overlap"
          print(f"Collider max overlap: {result['overlap'].max():.4f}  PASSED")
          EOF

  react-build:
    name: React TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: simulations/react/package.json

      - name: Install npm dependencies
        run: npm install
        working-directory: simulations/react

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: simulations/react

      - name: Build
        run: npm run build
        working-directory: simulations/react

  latex-check:
    name: LaTeX Paper Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check LaTeX file exists and is non-empty
        run: |
          test -s paper/main.tex && echo "paper/main.tex OK"
          wc -l paper/main.tex
