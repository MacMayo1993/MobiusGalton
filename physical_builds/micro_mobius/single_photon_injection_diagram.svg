<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#0f0f1a"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="monospace" font-size="15"
        fill="#e0e0f0" font-weight="bold">Micro-Möbius Waveguide — Midline Injection</text>

  <!-- Möbius strip outline (schematic) -->
  <ellipse cx="300" cy="220" rx="180" ry="80" fill="none"
           stroke="#7c3aed" stroke-width="18" stroke-opacity="0.4"/>
  <ellipse cx="300" cy="220" rx="180" ry="80" fill="none"
           stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Twist indicator -->
  <path d="M 300 140 Q 340 175 300 220 Q 260 265 300 300"
        fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="345" y="175" font-family="monospace" font-size="11" fill="#c084fc">
    half-twist (π)
  </text>

  <!-- Midline -->
  <line x1="120" y1="220" x2="480" y2="220"
        stroke="#facc15" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="490" y="224" font-family="monospace" font-size="10" fill="#facc15">midline</text>

  <!-- Injection point -->
  <circle cx="300" cy="140" r="8" fill="#4ade80"/>
  <text x="315" y="136" font-family="monospace" font-size="11" fill="#4ade80">
    injection (Y-junction)
  </text>
  <line x1="300" y1="100" x2="300" y2="132" stroke="#4ade80" stroke-width="2"
        marker-end="url(#arrowG)"/>
  <text x="260" y="92" font-family="monospace" font-size="10" fill="#4ade80">
    single photon (H-pol)
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Photon paths (counter-clockwise = even, clockwise = odd after seam) -->
  <path d="M 300 148 A 180 80 0 1 0 300 292"
        fill="none" stroke="#3b82f6" stroke-width="2"
        marker-end="url(#arrowB)" stroke-opacity="0.8"/>
  <path d="M 300 148 A 180 80 0 1 1 300 292"
        fill="none" stroke="#ef4444" stroke-width="2"
        marker-end="url(#arrowR)" stroke-opacity="0.8" stroke-dasharray="5,3"/>

  <!-- Detector -->
  <rect x="265" y="295" width="70" height="28" rx="5"
        fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="300" y="314" text-anchor="middle" font-family="monospace" font-size="10"
        fill="#4ade80">SPAD detector</text>

  <!-- Parity labels -->
  <text x="130" y="195" font-family="monospace" font-size="10" fill="#3b82f6">
    even parity (H-pol)
  </text>
  <text x="380" y="255" font-family="monospace" font-size="10" fill="#ef4444">
    odd parity (V-pol)
  </text>

  <!-- Berry phase annotation -->
  <text x="20" y="360" font-family="monospace" font-size="10" fill="#888">
    Berry phase = π on one full loop (non-orientable topology → polarisation flip)
  </text>
  <text x="20" y="378" font-family="monospace" font-size="10" fill="#888">
    α₊ = ½[1 + cos^H(π/W)]   matches theory exactly
  </text>
</svg>
